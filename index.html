<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AURA // Quantum Neural Core v2.5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --quantum-cyan: #00f0ff;
      --quantum-purple: #7928ca;
      --quantum-pink: #ff007f;
      --quantum-bg: #030014;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--quantum-bg);
      color: #f1f5f9;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }

    .font-mono-custom {
      font-family: 'JetBrains Mono', monospace;
    }

    .glass-panel {
      background: rgba(13, 10, 38, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(0, 240, 255, 0.18);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 240, 255, 0.05);
    }

    .glass-panel-active {
      border-color: var(--quantum-cyan);
      box-shadow: 0 0 50px rgba(0, 240, 255, 0.35), inset 0 0 30px rgba(0, 240, 255, 0.15);
    }

    .text-glow-cyan {
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.7);
    }

    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(3, 0, 20, 0.4);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 240, 255, 0.3);
      border-radius: 4px;
    }

    .scanlines {
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0, 0, 0, 0.3) 50%,
        rgba(0, 0, 0, 0.3)
      );
      background-size: 100% 4px;
    }
  </style>
</head>
<body class="min-h-[100dvh] flex flex-col justify-center items-center p-3 sm:p-6 md:p-8 relative selection:bg-cyan-500/30 selection:text-cyan-200">

  <!-- Fondo adaptativo -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute top-[-15%] left-[-10%] w-[50vw] max-w-[500px] h-[50vw] max-h-[500px] rounded-full bg-gradient-to-r from-cyan-600/20 to-purple-600/20 blur-[100px]"></div>
    <div class="absolute bottom-[-15%] right-[-10%] w-[60vw] max-w-[600px] h-[60vw] max-h-[600px] rounded-full bg-gradient-to-r from-purple-600/20 to-pink-600/15 blur-[120px]"></div>
    <div class="absolute inset-0 bg-[radial-gradient(#00f0ff10_1px,transparent_1px)] [background-size:24px_24px] sm:[background-size:32px_32px] opacity-30"></div>
    <div class="absolute inset-0 scanlines opacity-20"></div>
  </div>

  <!-- Contenedor Elástico Central -->
  <main class="w-full max-w-[520px] glass-panel rounded-2xl sm:rounded-[32px] p-4 sm:p-7 md:p-8 flex flex-col gap-4 sm:gap-6 relative z-10 my-auto shadow-2xl">
    
    <!-- Encabezado -->
    <header class="flex items-center justify-between border-b border-cyan-500/20 pb-3 sm:pb-4">
      <div class="flex items-center gap-2.5 sm:gap-3">
        <div class="relative flex items-center justify-center w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-cyan-950/60 border border-cyan-400/40 text-cyan-400 shadow-[0_0_15px_rgba(0,240,255,0.3)] shrink-0">
          <svg class="w-4 h-4 sm:w-5 sm:h-5 animate-spin" style="animation-duration: 12s;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a7 7 0 017 7m0 0a7 7 0 01-7 7m7-7H4"></path>
          </svg>
          <div class="absolute inset-0 rounded-xl bg-cyan-400/10 animate-pulse"></div>
        </div>
        <div class="min-w-0">
          <h1 class="font-extrabold tracking-wider text-sm sm:text-base text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-300 truncate">AURA // QUANTUM</h1>
          <p class="text-[9px] sm:text-[10px] font-mono-custom text-cyan-400/70 tracking-widest uppercase">Neural Matrix v2</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <div class="px-2.5 sm:px-3 py-1 rounded-full bg-slate-900/80 border border-slate-700/60 flex items-center gap-1.5 sm:gap-2">
          <span class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-slate-500 transition-colors" id="status-dot"></span>
          <span class="text-[10px] sm:text-xs font-mono-custom tracking-wider text-slate-300 uppercase" id="status-badge">Standby</span>
        </div>
      </div>
    </header>

    <!-- Área de Texto Fluida -->
    <section class="flex flex-col gap-2">
      <div class="flex justify-between items-center text-[11px] sm:text-xs font-mono-custom text-cyan-400/80 uppercase tracking-widest px-1">
        <span class="flex items-center gap-1.5 truncate">
          <svg class="w-3.5 h-3.5 text-cyan-400 shrink-0 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path></svg>
          <span class="truncate">Transcripción</span>
        </span>
        <span id="word-counter" class="text-indigo-300 bg-indigo-950/50 px-2 py-0.5 rounded border border-indigo-500/30 shrink-0 text-[10px] sm:text-xs">0 Palabras</span>
      </div>
      <div class="relative rounded-xl sm:rounded-2xl bg-slate-950/70 border border-cyan-500/20 p-3 sm:p-4 shadow-inner">
        <textarea id="transcript" class="w-full h-28 sm:h-36 md:h-40 bg-transparent border-none text-slate-100 placeholder-slate-600 font-sans text-xs sm:text-sm leading-relaxed resize-none outline-none" placeholder="Toca el núcleo inferior y comienza a hablar..."></textarea>
        <div class="absolute bottom-2.5 right-3 pointer-events-none flex items-center gap-1.5 opacity-50">
          <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span>
          <span class="text-[8px] sm:text-[9px] font-mono-custom text-cyan-300">SYNC ACTIVO</span>
        </div>
      </div>
    </section>

    <!-- Núcleo Interactivo de Voz y Espectro -->
    <section class="w-full flex flex-col items-center">
      <div class="relative w-full h-28 sm:h-36 rounded-xl sm:rounded-2xl bg-gradient-to-b from-slate-900/80 to-slate-950/90 border border-cyan-500/30 overflow-hidden flex items-center justify-center cursor-pointer group shadow-[0_0_25px_rgba(0,240,255,0.1)] transition-all duration-300 hover:border-cyan-400" id="core-trigger">
        
        <div class="absolute inset-0 opacity-25 transition-opacity duration-150" id="ambient-glow" style="background: radial-gradient(circle, rgba(0,240,255,0.4) 0%, transparent 70%); transform: scale(1);"></div>

        <canvas id="audio-canvas" class="absolute inset-0 w-full h-full z-10 pointer-events-none"></canvas>

        <div class="relative z-20 flex flex-col items-center gap-1.5 sm:gap-2 pointer-events-none transition-transform duration-300 group-hover:scale-105">
          <div class="w-11 h-11 sm:w-14 sm:h-14 rounded-full bg-cyan-950/80 border-2 border-cyan-400 flex items-center justify-center text-cyan-400 shadow-[0_0_20px_rgba(0,240,255,0.5)] transition-all duration-300" id="core-icon-container">
            <svg class="w-5 h-5 sm:w-7 sm:h-7 transition-transform duration-300" id="mic-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path>
            </svg>
          </div>
          <span class="text-[10px] sm:text-xs font-mono-custom font-bold tracking-widest text-cyan-300 text-glow-cyan uppercase text-center px-2" id="core-label">Click para Iniciar</span>
        </div>

        <div class="absolute top-2 right-2 sm:top-2.5 sm:right-3.5 z-20 flex items-center gap-1 bg-slate-900/80 px-2 py-0.5 sm:py-1 rounded border border-cyan-500/30">
          <span class="text-[9px] sm:text-[10px] font-mono-custom text-slate-400">SENSIBILIDAD:</span>
          <span class="text-[9px] sm:text-[10px] font-mono-custom text-cyan-400 font-bold" id="sens-val">0.0%</span>
        </div>
      </div>
    </section>

    <!-- Controles en Rejilla Responsiva -->
    <footer class="grid grid-cols-2 gap-2.5 sm:gap-3">
      <button id="copy-btn" class="relative overflow-hidden px-3 sm:px-4 py-2.5 sm:py-3 rounded-lg sm:rounded-xl bg-cyan-950/40 border border-cyan-500/30 text-cyan-300 font-semibold text-[11px] sm:text-xs tracking-wider uppercase transition-all duration-200 hover:bg-cyan-900/40 hover:border-cyan-400 active:scale-95 flex items-center justify-center gap-1.5 sm:gap-2">
        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
        <span id="copy-label">Copiar</span>
      </button>

      <button id="clear-btn" class="relative overflow-hidden px-3 sm:px-4 py-2.5 sm:py-3 rounded-lg sm:rounded-xl bg-pink-950/30 border border-pink-500/30 text-pink-300 font-semibold text-[11px] sm:text-xs tracking-wider uppercase transition-all duration-200 hover:bg-pink-900/40 hover:border-pink-400 active:scale-95 flex items-center justify-center gap-1.5 sm:gap-2">
        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        <span>Limpiar</span>
      </button>
    </footer>

  </main>

  <script src="./transcripcion.js"></script>
</body>
</html>
