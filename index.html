<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Aura // Interface</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030712">
  <style>
    :root {
      --bg-base: #030712;
      --glass-bg: rgba(15, 23, 42, 0.65);
      --glass-border: rgba(56, 189, 248, 0.15);
      --glass-border-active: rgba(56, 189, 248, 0.5);
      --electric-blue: #38bdf8;
      --deep-glow: rgba(56, 189, 248, 0.25);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(14, 116, 144, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(3, 105, 161, 0.1) 0%, transparent 40%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    /* Barra Superior minimalista */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: -0.01em;
      color: var(--text-main);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #475569;
      transition: all 0.4s ease;
    }

    .status-dot.active {
      background: var(--electric-blue);
      box-shadow: 0 0 12px var(--electric-blue);
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .badge.active {
      color: var(--electric-blue);
      border-color: rgba(56, 189, 248, 0.3);
      background: rgba(56, 189, 248, 0.08);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
    }

    /* Pantalla de Transcripción Estilo Apple Notes */
    .screen-panel {
      background: rgba(2, 6, 23, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .screen-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .transcript-view {
      width: 100%;
      height: 210px;
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: none;
      outline: none;
      user-select: text;
    }

    .transcript-view::placeholder {
      color: #334155;
    }

    /* Controles Centrales */
    .control-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .mic-trigger {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(14, 116, 144, 0.25));
      border: 1px solid var(--glass-border-active);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .mic-trigger:active {
      transform: scale(0.94);
    }

    .mic-trigger.recording {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.35), rgba(2, 132, 199, 0.5));
      border-color: var(--electric-blue);
      box-shadow: 0 0 35px var(--deep-glow), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      animation: apple-pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
    }

    .mic-icon {
      font-size: 1.6rem;
    }

    .mic-label {
      font-size: 0.6rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .mic-trigger.recording .mic-label {
      color: var(--text-main);
    }

    /* Acciones Secundarias estilo Apple Glass */
    .actions-grid {
      display: flex;
      width: 100%;
      gap: 10px;
    }

    .btn-action {
      flex: 1;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      color: var(--text-main);
      font-weight: 500;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.2);
    }

    @keyframes apple-pulse {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4), 0 0 30px var(--deep-glow); }
      70% { box-shadow: 0 0 0 20px rgba(56, 189, 248, 0), 0 0 30px var(--deep-glow); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0), 0 0 30px var(--deep-glow); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <div class="logo-area">
        <div class="status-dot" id="led-indicator"></div>
        AURA OS
      </div>
      <div class="badge" id="status-badge">STANDBY</div>
    </div>

    <!-- Pantalla de Transcripción Fluida -->
    <div class="screen-panel">
      <div class="screen-header">
        <span>AUDIO STREAM LIVE</span>
        <span id="word-counter">0 PALABRAS</span>
      </div>
      <textarea id="transcript" class="transcript-view" readonly placeholder="Inicia la transmisión para capturar texto en tiempo real..."></textarea>
    </div>

    <!-- Controles -->
    <div class="control-center">
      <button class="mic-trigger" id="mic-btn">
        <span class="mic-icon" id="mic-icon">🎙️</span>
        <span class="mic-label" id="mic-label">RECORD</span>
      </button>

      <div class="actions-grid">
        <button class="btn-action" id="copy-btn">📋 Copiar</button>
        <button class="btn-action" id="clear-btn">✨ Limpiar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
