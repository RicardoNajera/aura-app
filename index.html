<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura - Operativo PWA</title>
    <!-- Vinculación del Manifiesto PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0e15">
    
    <style>
        :root {
            --bg-color: #0d0e15;
            --panel-bg: #161925;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff0055;
            --neon-green: #00ff66;
            --text-main: #f0f2f5;
            --text-muted: #8b9bb4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
            border: 1px solid rgba(0, 243, 255, 0.3);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.6);
            letter-spacing: 1px;
        }

        #install-btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: none; /* Se activa mediante JS si la app es instalable */
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(0, 243, 255, 0.2);
        }

        #install-btn:hover {
            background: var(--neon-cyan);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .main-container {
            width: 100%;
            max-width: 600px;
            background: var(--panel-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-grow: 1;
            margin-bottom: 20px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 15px var(--neon-green); }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .transcript-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            min-height: 180px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-main);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: auto;
        }

        .btn-mic {
            background: transparent;
            color: var(--neon-pink);
            border: 2px solid var(--neon-pink);
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-mic:hover {
            background: var(--neon-pink);
            color: var(--bg-color);
            box-shadow: 0 0 25px var(--neon-pink);
        }

        .btn-mic.listening {
            background: var(--neon-pink);
            color: var(--bg-color);
            animation: mic-pulse 1s infinite;
        }

        @keyframes mic-pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 0, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 0, 85, 0); }
        }

        footer {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>AURA // OPERATIVO</h1>
        <button id="install-btn">Instalar App</button>
    </header>

    <div class="main-container">
        <div class="status-indicator">
            <div class="pulse-dot"></div>
            <span id="status-text">Sistema Operativo Conectado</span>
        </div>

        <div class="transcript-box" id="transcript">
            Presiona el botón de voz para iniciar la transcripción en tiempo real de los reportes operativos...
        </div>

        <div class="controls">
            <button id="mic-btn" class="btn-mic">
                🎙️ <span id="mic-text">Iniciar Voz</span>
            </button>
        </div>
    </div>

    <footer>
        Industronic Systems &bull; PWA Core v1.0
    </footer>

    <!-- Script principal de la lógica -->
    <script src="app.js"></script>
</body>
</html>
