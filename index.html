<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AURA RADIO - PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121820">
  <style>
    :root {
      --bg-color: #0b0f14;
      --card-bg: #161f28;
      --accent-green: #00ff88;
      --accent-green-glow: rgba(0, 255, 136, 0.4);
      --radio-red: #ff3355;
      --radio-red-glow: rgba(255, 51, 85, 0.5);
      --lcd-bg: #05130e;
      --text-color: #e0f0eb;
      --subtext: #6b827a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .radio-container {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 2px solid #243240;
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    /* Header Radio */
    .radio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 5px;
    }

    .brand {
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 1.1rem;
      color: var(--text-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #445566;
    }

    .brand-dot.active {
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse-green 1.5s infinite;
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 12px;
      background: #0f1720;
      border: 1px solid #223344;
      color: var(--subtext);
      text-transform: uppercase;
    }

    .status-badge.transmitting {
      color: var(--radio-red);
      border-color: var(--radio-red);
      box-shadow: 0 0 8px var(--radio-red-glow);
    }

    /* Pantalla LCD */
    .lcd-display {
      background: var(--lcd-bg);
      border: 2px solid #102d23;
      border-radius: 16px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
    }

    .lcd-top-bar {
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 0.75rem;
      color: #00aa55;
      border-bottom: 1px solid #0d382b;
      padding-bottom: 6px;
    }

    .transcript-box {
      width: 100%;
      height: 220px;
      background: transparent;
      border: none;
      color: var(--accent-green);
      font-family: 'Courier New', Courier, monospace;
      font-size: 1rem;
      line-height: 1.5;
      resize: none;
      outline: none;
      user-select: text;
    }

    .transcript-box::placeholder {
      color: #1a5540;
    }

    /* Controles de Radio */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 5px;
    }

    .ptt-button {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1c2836, #121a24);
      border: 4px solid #2a3c50;
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 0 2px 3px rgba(255,255,255,0.1);
      transition: all 0.2s ease;
      position: relative;
    }

    .ptt-button:active {
      transform: scale(0.95);
    }

    .ptt-button.recording {
      border-color: var(--radio-red);
      background: linear-gradient(145deg, #3d0a14, #21050a);
      box-shadow: 0 0 30px var(--radio-red-glow), inset 0 2px 3px rgba(255,255,255,0.2);
    }

    .ptt-icon {
      font-size: 2rem;
    }

    .ptt-label {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--subtext);
    }

    .ptt-button.recording .ptt-label {
      color: var(--radio-red);
    }

    .action-row {
      display: flex;
      width: 100%;
      gap: 10px;
    }

    .btn-secondary {
      flex: 1;
      padding: 12px;
      background: #111a24;
      border: 1px solid #223344;
      border-radius: 12px;
      color: var(--text-color);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary:hover {
      background: #1a2736;
    }

    @keyframes pulse-green {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <div class="radio-container">
    <!-- Header -->
    <div class="radio-header">
      <div class="brand">
        <div class="brand-dot" id="led-indicator"></div>
        AURA RX-1
      </div>
      <div class="status-badge" id="status-badge">EN ESPERA</div>
    </div>

    <!-- Pantalla LCD de Transcripción -->
    <div class="lcd-display">
      <div class="lcd-top-bar">
        <span>FREQ: 108.0 MHz</span>
        <span id="word-count">0 PALABRAS</span>
      </div>
      <textarea id="transcript" class="transcript-box" readonly placeholder="Presiona transmisión para comenzar a escuchar de forma continua..."></textarea>
    </div>

    <!-- Botones y Micrófono -->
    <div class="controls">
      <button class="ptt-button" id="mic-btn">
        <span class="ptt-icon" id="mic-icon">🎙️</span>
        <span class="ptt-label" id="mic-label">TRANSMITIR</span>
      </button>

      <div class="action-row">
        <button class="btn-secondary" id="copy-btn">📋 Copiar</button>
        <button class="btn-secondary" id="clear-btn">🗑️ Limpiar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
