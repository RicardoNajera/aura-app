<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Aura // Interface v1.1</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030712">
  <style>
    :root {
      --bg-base: #030712;
      --glass-bg: rgba(15, 23, 42, 0.65);
      --glass-border: rgba(56, 189, 248, 0.15);
      --electric-blue: #38bdf8;
      --deep-glow: rgba(56, 189, 248, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(14, 116, 144, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(3, 105, 161, 0.1) 0%, transparent 40%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .version-tag {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--electric-blue);
      background: rgba(56, 189, 248, 0.1);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .badge.active {
      color: var(--electric-blue);
      border-color: rgba(56, 189, 248, 0.3);
      background: rgba(56, 189, 248, 0.08);
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
    }

    .screen-panel {
      background: rgba(2, 6, 23, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .screen-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .transcript-view {
      width: 100%;
      height: 180px;
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: none;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .transcript-view::placeholder {
      color: #334155;
    }

    .control-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Barra Siri Interactiva */
    .siri-container {
      width: 100%;
      height: 74px;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.8), rgba(2, 6, 23, 0.9));
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      touch-action: manipulation;
    }

    .siri-container:active {
      transform: scale(0.97);
    }

    .siri-container.recording {
      border-color: var(--electric-blue);
      box-shadow: 0 0 30px var(--deep-glow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .siri-label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      text-transform: uppercase;
      z-index: 2;
      transition: color 0.3s;
    }

    .siri-container.recording .siri-label {
      color: var(--electric-blue);
      text-shadow: 0 0 10px var(--deep-glow);
    }

    /* Ondas Siri dinámicas con transición ultra fluida */
    .siri-waves {
      position: absolute;
      bottom: 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      z-index: 1;
      opacity: 0.15;
      transition: opacity 0.3s ease;
    }

    .siri-container.recording .siri-waves {
      opacity: 1;
    }

    .wave-bar {
      width: 4px;
      height: 6px;
      background: var(--electric-blue);
      border-radius: 4px;
      /* Transición extremadamente rápida para capturar cada cambio de altura orgánico */
      transition: height 0.05s ease-in-out;
      box-shadow: 0 0 10px var(--electric-blue);
    }

    .actions-grid {
      display: flex;
      width: 100%;
      gap: 10px;
    }

    .btn-action {
      flex: 1;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      color: var(--text-main);
      font-weight: 500;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover {
      background: rgba(56, 189, 248, 0.08);
      border-color: rgba(56, 189, 248, 0.2);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="logo-area">
        AURA OS <span class="version-tag">v1.1</span>
      </div>
      <div class="badge" id="status-badge">STANDBY</div>
    </div>

    <div class="screen-panel">
      <div class="screen-header">
        <span>AUDIO STREAM LIVE</span>
        <span id="word-counter">0 PALABRAS</span>
      </div>
      <textarea id="transcript" class="transcript-view" readonly placeholder="Mantén presionado el panel inferior para hablar..."></textarea>
    </div>

    <div class="control-center">
      <div class="siri-container" id="mic-btn">
        <span class="siri-label" id="mic-label">MANTÉN PRESIONADO PARA HABLAR</span>
        <div class="siri-waves" id="waves-box">
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
      </div>

      <div class="actions-grid">
        <button class="btn-action" id="copy-btn">📋 Copiar</button>
        <button class="btn-action" id="clear-btn">✨ Limpiar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
