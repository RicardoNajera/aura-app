<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Dirección Ejecutiva</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body class="bg-black text-slate-200 h-screen w-screen overflow-hidden font-sans antialiased selection:bg-amber-500/30">
  <!-- Capa de fondo elegante y profunda -->
  <div class="fixed inset-0 w-full h-full bg-ejecutivo -z-20"></div>
  <!-- Elementos de luz difuminada para el efecto premium -->
  <div class="fixed top-0 right-0 w-[800px] h-[800px] bg-amber-900/20 rounded-full blur-[120px] -z-10 pointer-events-none translate-x-1/3 -translate-y-1/3"></div>
  <div class="fixed bottom-0 left-0 w-[600px] h-[600px] bg-indigo-900/20 rounded-full blur-[100px] -z-10 pointer-events-none -translate-x-1/3 translate-y-1/3"></div>

  <div id="app-root" class="w-full h-full relative overflow-y-auto"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
